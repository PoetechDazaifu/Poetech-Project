name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and build poem data
        run: python scripts/rebuild_data.py
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q app.py init_db.py convert_to_json.py scripts tests
